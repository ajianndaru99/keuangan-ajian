name: Build Android APK (Keuangan Keluarga)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Keuangan Keluarga APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Release & Debug APK
        run: |
          cd android
          gradle assembleRelease assembleDebug --stacktrace

      - name: Organize Installer Packages
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} dist-apk/KeuanganKeluarga-Release.apk \; || true
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist-apk/KeuanganKeluarga-Debug.apk \; || true
          ls -la dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeuanganKeluarga-APK
          path: dist-apk/*.apk
          retention-days: 30

      - name: Publish Direct Download to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Keuangan Keluarga APK (Terbaru)"
          body: |
            Paket installer aplikasi Android Keuangan Keluarga resmi.
            Siap dipasang langsung di Infinix Note 30 Pro dan perangkat keluarga lainnya.
            
            - **KeuanganKeluarga-Release.apk**: Paket rilis teroptimasi dengan verifikasi signature.
            - **KeuanganKeluarga-Debug.apk**: Paket pengujian alternatif.
          files: |
            dist-apk/KeuanganKeluarga-Release.apk
            dist-apk/KeuanganKeluarga-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
