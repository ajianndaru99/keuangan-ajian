name: Build Android APK (Keuangan Keluarga)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Keuangan Keluarga APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Permanent Release Keystore
        run: |
          if [ ! -f android/keystore.jks ]; then
            echo "Membuat keystore rilis permanen untuk keluarga..."
            keytool -genkeypair -v -keystore android/keystore.jks \
              -alias keuangan \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass keluargaKeuangan2024 \
              -keypass keluargaKeuangan2024 \
              -dname "CN=KeuanganKeluarga, OU=Family, O=Keluarga, L=Jakarta, ST=DKI, C=ID"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/keystore.jks
            git commit -m "ci: commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Build Android APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: keluargaKeuangan2024
          KEY_ALIAS: keuangan
          KEY_PASSWORD: keluargaKeuangan2024
        run: |
          cd android
          gradle assembleRelease assembleDebug --stacktrace --no-daemon > build.log 2>&1 || {
            STATUS=$?
            echo "Build failed with code $STATUS"
            cat build.log
            exit $STATUS
          }

      - name: Commit & Push Build Log if Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-build-log
          cp android/build.log build-error.log
          git add build-error.log
          git commit -m "ci: capture build error log [skip ci]"
          git push origin ci-build-log --force

      - name: Organize Installer Packages
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/ \; || true
          ls -la dist-apk/
          # Prioritaskan APK rilis bertanda tangan resmi
          if [ -f dist-apk/app-release.apk ]; then
            cp dist-apk/app-release.apk dist-apk/KeuanganKeluarga-Release.apk
          elif [ -f dist-apk/app-debug.apk ]; then
            cp dist-apk/app-debug.apk dist-apk/KeuanganKeluarga-Release.apk
          fi
          if [ -f dist-apk/app-debug.apk ]; then
            cp dist-apk/app-debug.apk dist-apk/KeuanganKeluarga-Debug.apk
          fi
          # Buat file version.json otomatis untuk In-App Updater
          echo "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.0.${{ github.run_number }}\", \"apkUrl\": \"https://github.com/ajianndaru99/keuangan-ajian/releases/latest/download/KeuanganKeluarga-Release.apk\"}" > dist-apk/version.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeuanganKeluarga-APK
          path: dist-apk/*
          retention-days: 30

      - name: Publish Direct Download to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Keuangan Keluarga APK (Terbaru)"
          body: |
            Paket installer aplikasi Android Keuangan Keluarga resmi.
            Siap dipasang langsung di Infinix Note 30 Pro dan perangkat keluarga lainnya.
          files: |
            dist-apk/*.apk
            dist-apk/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
