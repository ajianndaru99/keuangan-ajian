<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle Inner Card -->
  <rect x="76" y="116" width="360" height="280" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />
  
  <!-- Wallet / Vault Symbol -->
  <rect x="116" y="156" width="280" height="200" rx="24" fill="url(#glow)" />
  <rect x="290" y="226" width="116" height="60" rx="16" fill="#ffffff" />
  <circle cx="330" cy="256" r="10" fill="#0284c7" />
  
  <!-- Growth Accent Leaf/Arrow -->
  <path d="M 170 270 L 220 220 L 250 250 L 300 200" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 280 200 L 300 200 L 300 220" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
