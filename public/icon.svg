<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="55%" stop-color="#0f2442" />
      <stop offset="100%" stop-color="#093834" />
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Squircle Emblem Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="10" />

  <!-- Subtle Inner Shield Line -->
  <rect x="52" y="52" width="408" height="408" rx="88" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="3" />

  <!-- Architectural Monogram 'A' + Financial Pillar Bars -->
  <!-- Left & Right Ascending Pillars -->
  <path
    d="M256 108 L136 376 H192 L256 224 L320 376 H376 L256 108 Z"
    fill="url(#crestGrad)"
  />

  <!-- Crossbar Wallet/Ledger Bridge -->
  <rect x="184" y="286" width="144" height="34" rx="12" fill="#f8fafc" />

  <!-- Three Ascending Financial Bars Inside Base -->
  <rect x="208" y="344" width="22" height="32" rx="6" fill="#38bdf8" opacity="0.85" />
  <rect x="245" y="330" width="22" height="46" rx="6" fill="#10b981" />
  <rect x="282" y="316" width="22" height="60" rx="6" fill="#34d399" />

  <!-- Apex Family Harmony Node -->
  <circle cx="256" cy="100" r="14" fill="url(#accentGold)" />
</svg>
